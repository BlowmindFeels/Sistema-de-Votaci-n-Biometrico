services:
  auth-db:
    image: postgres:16
    container_name: votacion-auth-db
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - auth-data:/var/lib/postgresql/data
      - ./db/auth/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth"]
      interval: 5s
      retries: 10

  voting-db:
    image: postgres:16
    container_name: votacion-voting-db
    environment:
      POSTGRES_DB: voting
      POSTGRES_USER: voting_user
      POSTGRES_PASSWORD: ${VOTING_DB_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - voting-data:/var/lib/postgresql/data
      - ./db/voting/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voting_user -d voting"]
      interval: 5s
      retries: 10

  notification-db:
    image: postgres:16
    container_name: votacion-notification-db
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: ${NOTIF_DB_PASSWORD}
    ports: ["5434:5432"]
    volumes:
      - notification-data:/var/lib/postgresql/data
      - ./db/notification/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notification"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: votacion-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "5672:5672"     # los servicios se conectan aquí
      - "15672:15672"   # panel web
    volumes:
      - rabbit-data:/var/lib/rabbitmq

volumes:
  auth-data:
  voting-data:
  notification-data:
  rabbit-data: